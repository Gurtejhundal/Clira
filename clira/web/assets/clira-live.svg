<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" fill="none" aria-hidden="true">
  <defs>
    <!-- Canonical silhouette is shared by every expression. Facial edits never replace it. -->
    <clipPath id="clira-head-clip"><path d="M0 0H1254V780H885L846 820L821 933L702 869L552 791H0Z"/></clipPath>
    <mask id="clira-torso-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><path fill="white" d="M0 0H1254V1254H0Z"/><path fill="black" stroke="white" stroke-width="12" d="M0 0H1254V780H885L846 820L821 933L702 869L552 791H0Z"/></mask>
    <clipPath id="clira-features-clip">
      <path d="M674 286H819V430H674Z M842 278H959V415H842Z M822 484H974V577H822Z"/>
    </clipPath>
    <clipPath id="clira-eyes-clip"><path d="M680 348H809V422H680Z M871 338H955V406H871Z"/></clipPath>
    <clipPath id="clira-gaze-clip"><path d="M718 377Q746 359 773 379L771 397Q748 410 721 395Z M882 366Q899 352 916 366L915 384Q898 393 883 382Z"/></clipPath>
  </defs>
  <g class="character-body">
    <image class="canonical-torso" href="/static/assets/character-v2/neutral.webp" width="1254" height="1254" mask="url(#clira-torso-mask)"/>
    <g class="character-head">
      <g clip-path="url(#clira-head-clip)">
        <image class="canonical-head" href="/static/assets/character-v2/neutral.webp" width="1254" height="1254"/>
        <g class="expression-features" clip-path="url(#clira-features-clip)">
          <image class="expression-face" data-face="curious" data-src="/static/assets/character-v2/curious.webp" width="1254" height="1254"/>
          <image class="expression-face" data-face="happy" data-src="/static/assets/character-v2/happy.webp" width="1254" height="1254"/>
          <image class="expression-face" data-face="surprised" data-src="/static/assets/character-v2/surprised.webp" width="1254" height="1254"/>
          <image class="expression-face" data-face="thinking" data-src="/static/assets/character-v2/thinking.webp" width="1254" height="1254"/>
          <image class="expression-face" data-face="dizzy" data-src="/static/assets/character-v2/dizzy.webp" width="1254" height="1254"/>
          <image class="expression-face" data-face="concerned" data-src="/static/assets/character-v2/concerned.webp" width="1254" height="1254"/>
          <image class="expression-face" data-face="celebrating" data-src="/static/assets/character-v2/celebrating.webp" width="1254" height="1254"/>
        </g>
        <g class="character-gaze" clip-path="url(#clira-gaze-clip)"><image class="pupil" data-gaze-face="true" href="/static/assets/character-v2/neutral.webp" width="1254" height="1254"/></g>
        <g class="character-blink" clip-path="url(#clira-eyes-clip)"><image data-face="blink" data-src="/static/assets/character-v2/blink.webp" width="1254" height="1254"/></g>
      </g>
    </g>
  </g>
</svg>
