name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIRA_MODE: demo
      CLIRA_MODEL: offline
      CLIRA_ALLOW_MODEL_CALLS: '0'
      CLIRA_ENABLE_WRITES: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - name: Install media validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint, syntax and backend tests
        run: |
          uv run --locked ruff check clira tests scripts
          uv run --locked ruff format --check clira tests scripts
          node --check clira/web/app.js
          bash -n run.sh
          uv run --locked pytest -q
      - name: Verify browser workflows in isolated demo mode
        run: |
          uv run --locked playwright install --with-deps chromium
          uv run --locked python tests/browser_smoke.py --output work/ci-browser
          uv run --locked python tests/browser_workspace.py work/ci-workspace
          uv run --locked python tests/browser_chat_history.py work/ci-chat-history

      - name: Build and verify clean candidate installs (no publishing)
        run: |
          uv run --locked --extra dev python scripts/build_release.py --output work/ci-artifacts
          uv run --locked --extra dev python scripts/verify_artifacts.py --artifacts work/ci-artifacts --report work/ci-artifact-verification.json

  # Releases are deliberately manual. Verification never creates tags or GitHub releases.
