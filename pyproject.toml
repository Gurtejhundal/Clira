[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clira"
version = "1.0.0rc1"
description = "A local, single-agent YouTube operations partner"
readme = "README.md"
authors = [{name = "Gurtejhundal"}]
keywords = ["youtube", "ai-agent", "creator-tools", "analytics", "local-first"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.28,<1", "google-auth-oauthlib>=1.2,<2", "prompt-toolkit>=3.0.48,<4", "rich>=13.9,<15", "Pillow>=11,<13"]

[project.urls]
Homepage = "https://github.com/Gurtejhundal/Clira"
Repository = "https://github.com/Gurtejhundal/Clira"
Issues = "https://github.com/Gurtejhundal/Clira/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "playwright>=1.49,<2",
    "pexpect>=4.9,<5",
    "pyte>=0.8.2,<1",
]

[project.scripts]
clira = "clira.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["clira"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.hatch.build.targets.sdist]
only-include = ["clira", "docs", "mds", "scripts", "tests", ".github", ".env.example", ".gitignore", "AGENTS.md", "CHANGELOG.md", "CLIRA_V1_TERMINAL_WEB_MASTER_SPEC_AND_CODEX_PROMPT.md", "README.md", "pyproject.toml", "run.sh", "uv.lock"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.sqlite*", "**/client_secret*.json", "**/credentials*.json", "**/token*.json"]
